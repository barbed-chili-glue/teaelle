function exportJson() {
  const filename = `teaelle-backup-${new Date().toISOString().slice(0, 10)}.json`;
  const payload = {app: 'teaelle', version: 2, exportedAt: new Date().toISOString(), data: state};
  const json = JSON.stringify(payload, null, 2);

  // The Android shell cannot reliably download a Blob; use the native share
  // sheet instead so the backup can be saved to Drive, email, or Files.
  if (window.AndroidApp && typeof window.AndroidApp.shareJson === 'function') {
    window.AndroidApp.shareJson(filename, json);
    toast('Export ready to share');
    return;
  }

  const blob = new Blob([json], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('Export started');
}

function importJson(file) {
  if (!file) return;
  if (activeBrews.length) return toast('Finish the brews in progress first');
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const payload = JSON.parse(reader.result);
      const data = payload.data || payload;
      if (!data || !Array.isArray(data.teas) || !Array.isArray(data.brews)) throw new Error('bad format');
      if (!confirm('Replace all current data with this import?')) return;
      state = migrateState(data);
      state.version = 2;
      state.settings = Object.assign(freshState().settings, state.settings || {});
      const first = state.teas[0];
      form = first
        ? {teaId: first.id, waterMl: 250, milkMl: (first.type === 'green' || first.type === 'herbal') ? 0 : 20, tempC: first.targetTempC, handling: 'none', preheat: false, notes: '', targetSteepS: first.targetSteepS, madeFor: state.settings.raters[0] || ''}
        : {teaId: null, waterMl: 250, milkMl: 20, tempC: 95, handling: 'none', preheat: false, notes: '', targetSteepS: 180, madeFor: state.settings.raters[0] || ''};
      saveState();
      ui.sheet = null;
      ui.tab = 'history';
      ui.brewView = 'new';
      ui.insightTeaId = null;
      render();
      toast('Import complete');
    } catch (e) {
      toast('Could not read that JSON file');
    }
  };
  reader.readAsText(file);
}

function resetAll() {
  if (activeBrews.length) return toast('Finish the brews in progress first');
  if (!confirm('Reset everything? All brews, ratings and settings will be deleted.')) return;
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  state = freshState();
  activeBrews = [];
  form = {teaId: state.teas[0].id, waterMl: 250, milkMl: 20, tempC: state.teas[0].targetTempC, handling: 'none', preheat: false, notes: '', targetSteepS: state.teas[0].targetSteepS, madeFor: state.settings.raters[0] || ''};
  ui = {tab: 'brew', brewView: 'new', historyFilter: 'all', insightTeaId: null, insightRater: null, sheet: null};
  render();
  toast('Reset complete');
}

/* ---------- demo data ---------- */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function makeDemoData() {
  const rng = mulberry32(20261112);
  const randn = () => {
    let u = 0, v = 0;
    while (!u) u = rng();
    while (!v) v = rng();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  };
  const pick = arr => arr[Math.floor(rng() * arr.length)];
  const teas = clone(DEFAULT_TEAS);
  const brews = [];
  const plan = [
    {teaId: 'yorkshire-gold', n: 40},
    {teaId: 'twinings-eb', n: 24},
    {teaId: 'twinings-green', n: 18}
  ];
  let ts = Date.now() - 2 * 3600 * 1000;
  const notesPool = [
    'New bag opened today.', 'Bag split slightly on the squeeze.', 'Kettle had just boiled twice.',
    'Drank this one slower — still good.', 'Milk was cold from the fridge.', 'Slightly distracted; bag stayed in longer.'
  ];

  for (const p of plan) {
    const tea = teas.find(t => t.id === p.teaId);
    const green = tea.type === 'green';
    for (let i = 0; i < p.n; i++) {
      const core = rng() < 0.62;
      const waterMl = Math.round((core ? 240 + rng() * 50 : (green ? 210 + rng() * 70 : 220 + rng() * 100)) / 5) * 5;
      const milkMl = green ? 0 : Math.round((core ? 10 + rng() * 25 : rng() * 42) / 5) * 5;
      const tempC = Math.round(green ? (core ? 74 + rng() * 10 : 70 + rng() * 16) : (core ? 88 + rng() * 10 : 80 + rng() * 20));
      const steepS = Math.round(green ? (core ? 120 + rng() * 60 : 90 + rng() * 110) : (core ? 165 + rng() * 80 : 120 + rng() * 210));
      const handling = pick(['none', 'none', 'none', 'dunk', 'squeeze']);
      const preheat = rng() < 0.5;
      const conc = (tea.bagMassG / waterMl) * 1000;
      const milkFrac = milkMl / (waterMl + milkMl);
      const optTemp = green ? 78 : 93;
      const optTime = green ? 150 : 200;
      const optConc = green ? 8 : 12.8;
      const optMilk = green ? 0 : 0.08;
      const tPen = Math.pow(Math.log(steepS / optTime) / (green ? 0.30 : 0.32), 2);
      const tempPen = Math.pow((tempC - optTemp) / (green ? 5 : 6), 2);
      const concPen = Math.pow((conc - optConc) / (green ? 2 : 2.5), 2);
      const milkPen = green ? 0 : Math.pow((milkFrac - optMilk) / 0.055, 2);
      let score = (green ? 6.0 : 6.1)
        - 1.10 * tPen
        - 0.80 * tempPen
        - 0.45 * concPen
        - 0.90 * milkPen
        + (handling === 'dunk' ? 0.12 : handling === 'squeeze' ? -0.20 : 0)
        + (preheat ? 0.08 : 0)
        + randn() * 0.38;
      score = clamp(score, 1.2, 6.9);
      const overall = clamp(Math.round(score), 1, 7);
      const ratings = [];
      const unrated = (i % 9 === 4);
      if (!unrated) {
        ratings.push({
          id: uid(), rater: 'Alex', overall,
          strength: overall <= 2 ? 1 : rng() < 0.18 ? -1 : 0,
          bitterness: overall <= 3 ? 1 : rng() < 0.2 ? 1 : rng() < 0.35 ? -1 : 0,
          milk: green ? 0 : rng() < 0.2 ? -1 : rng() < 0.15 ? 1 : 0,
          wouldRepeat: overall >= 4,
          blinded: rng() < 0.7,
          ts: ts + 6 * 60 * 1000
        });
      }
      if (rng() < 0.28) {
        let eScore = score + 0.12 - (green ? 0 : 5 * Math.abs(milkFrac - 0.12)) + randn() * 0.4;
        const eOverall = clamp(Math.round(eScore), 1, 7);
        ratings.push({
          id: uid(), rater: 'Ellen', overall: eOverall,
          strength: eOverall <= 2 ? 1 : rng() < 0.2 ? -1 : 0,
          bitterness: eOverall <= 3 ? 1 : rng() < 0.25 ? 1 : 0,
          milk: green ? 0 : rng() < 0.25 ? -1 : rng() < 0.1 ? 1 : 0,
          wouldRepeat: eOverall >= 4,
          blinded: true,
          ts: ts + 11 * 60 * 1000
        });
      }
      brews.push({
        id: uid(), ts, teaId: tea.id, teaSnapshot: teaSnapshot(tea), waterMl, milkMl, tempC, steepS, handling, preheat,
        notes: rng() < 0.1 ? pick(notesPool) : '', confirmed: true, ratings
      });
      ts -= Math.round((6 + rng() * 16) * 3600 * 1000);
    }
  }
  brews.sort((a, b) => b.ts - a.ts);
  return {teas, brews};
}

/* ---------- event wiring ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;

  if (action === 'close-sheet' && e.target.closest('.sheet') && !e.target.closest('.sheet-close')) return;
  if (action === 'open-detail' && e.target.closest('[data-action="rate"],[data-action="confirm-brew"]')) return;

  switch (action) {
    case 'tab':
      ui.tab = el.dataset.tab;
      render();
      break;
    case 'start': startBrew(); break;
    case 'stop': stopBrew(el.dataset.id); break;
    case 'select-brew':
      ui.brewView = el.dataset.id;
      render();
      break;
    case 'new-brew':
      ui.brewView = 'new';
      render();
      break;
    case 'open-manual': openManual(); break;
    case 'set-manual': setManualField(el.dataset.field, el.dataset.value); break;
    case 'save-manual': saveManual(); break;
    case 'edit-active': openActiveActuals(el.dataset.id); break;
    case 'save-active': saveActiveActuals(); break;
    case 'set-confirm': setConfirmField(el.dataset.field, el.dataset.value); break;
    case 'discard': discardActive(el.dataset.id); break;
    case 'open-settings':
      ui.sheet = {type: 'settings'};
      render();
      break;
    case 'open-library':
      ui.sheet = {type: 'library'};
      render();
      break;
    case 'close-sheet':
      ui.sheet = null;
      render();
      break;
    case 'rate':
      e.stopPropagation();
      openRating(el.dataset.id);
      break;
    case 'confirm-brew':
      e.stopPropagation();
      openConfirm(el.dataset.id);
      break;
    case 'confirm-and-rate':
      confirmAndRate();
      break;
    case 'confirm-save':
      confirmSave();
      break;
    case 'confirm-discard':
      confirmDiscard();
      break;
    case 'open-detail':
      openDetail(el.dataset.id);
      break;
    case 'set-rating':
      setRatingField(el.dataset.field, Number(el.dataset.value));
      break;
    case 'save-rating':
      saveRating();
      break;
    case 'add-rating':
      openRating(el.dataset.id);
      break;
    case 'brew-again':
      brewAgain(el.dataset.id);
      break;
    case 'delete-brew':
      deleteBrew(el.dataset.id);
      break;
    case 'filter':
      ui.historyFilter = el.dataset.filter;
      render();
      break;
    case 'load-demo':
      loadDemo();
      break;
    case 'export':
      exportJson();
      break;
    case 'import':
      $('#import-file').click();
      break;
    case 'reset':
      resetAll();
      break;
    case 'add-rater':
      addRater();
      break;
    case 'add-tea':
      ui.sheet = {type: 'tea'};
      render();
      break;
    case 'edit-tea':
      ui.sheet = {type: 'tea', editId: el.dataset.id};
      render();
      break;
    case 'delete-tea':
      deleteTea(el.dataset.id);
      break;
    case 'save-tea':
      saveTea();
      break;
    case 'remove-rater':
      removeRater(el.dataset.name);
      break;
    case 'set-form':
      form[el.dataset.field] = el.dataset.value;
      state.settings.lastRecipe = clone(form);
      saveState();
      render();
      break;
    case 'use-cell':
      form.tempC = Number(el.dataset.temp);
      form.targetSteepS = Number(el.dataset.time);
      ui.tab = 'brew';
      ui.sheet = null;
      render();
      toast(`Loaded ${el.dataset.temp}°C · ${fmtSteep(Number(el.dataset.time))}`);
      break;
    default:
      break;
  }
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.matches('[data-insight-tea]')) {
    ui.insightTeaId = el.value;
    render();
  }
  if (el.matches('[data-insight-rater]')) {
    ui.insightRater = el.value;
    render();
  }
  if (el.matches('[data-form="teaId"]')) {
    form.teaId = el.value;
    const tea = getTea(el.value);
    if (!tea) return;
    form.tempC = tea.targetTempC;
    form.targetSteepS = tea.targetSteepS;
    if (tea.type === 'green' || tea.type === 'herbal') form.milkMl = 0;
    state.settings.lastRecipe = clone(form);
    saveState();
    render();
  }
  if (el.matches('[data-sheet-field="wouldRepeat"]')) {
    if (ui.sheet && ui.sheet.type === 'rating') ui.sheet.draft.wouldRepeat = el.checked;
  }
  if (el.matches('[data-sheet-field="rater"]')) {
    if (ui.sheet && ui.sheet.type === 'rating') ui.sheet.draft.rater = el.value;
  }
  if (el.matches('[data-confirm]') && ui.sheet && (ui.sheet.type === 'confirm' || ui.sheet.type === 'actuals')) {
    ui.sheet.draft[el.dataset.confirm] = el.type === 'checkbox' ? el.checked : el.value;
    if (el.type === 'number') updateActualDerived();
  }
  if (el.matches('[data-manual]') && ui.sheet && ui.sheet.type === 'manual') {
    const field = el.dataset.manual;
    ui.sheet.draft[field] = el.type === 'checkbox' ? el.checked : el.value;
    if (field === 'teaId') {
      const tea = getTea(el.value);
      if (tea) {
        ui.sheet.draft.tempC = tea.targetTempC;
        ui.sheet.draft.steepMin = Math.floor(tea.targetSteepS / 60);
        ui.sheet.draft.steepSec = tea.targetSteepS % 60;
        if (tea.type === 'green' || tea.type === 'herbal') ui.sheet.draft.milkMl = 0;
      }
      renderSheetOnly();
    }
  }
  if (el.matches('[data-setting]')) {
    const key = el.dataset.setting;
    const val = el.value === '' ? null : Number(el.value);
    state.settings[key] = val;
    saveState();
  }
  if (el.id === 'import-file' && el.files && el.files[0]) {
    importJson(el.files[0]);
    el.value = '';
  }
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.matches('[data-confirm]') && ui.sheet && (ui.sheet.type === 'confirm' || ui.sheet.type === 'actuals')) {
    ui.sheet.draft[el.dataset.confirm] = el.type === 'checkbox' ? el.checked : el.value;
    if (el.type === 'number') updateActualDerived();
  }
  if (el.matches('[data-manual]') && ui.sheet && ui.sheet.type === 'manual') {
    const d = ui.sheet.draft;
    const field = el.dataset.manual;
    d[field] = el.type === 'checkbox' ? el.checked : el.value;
    if (field === 'waterMl' || field === 'milkMl') {
      const tea = getTea(d.teaId);
      const water = Number(d.waterMl) || 0;
      const milk = Number(d.milkMl) || 0;
      if ($('#manual-conc')) $('#manual-conc').textContent = round1(((tea ? Number(tea.bagMassG) : 2) / Math.max(1, water)) * 1000);
      if ($('#manual-mf')) $('#manual-mf').textContent = water + milk > 0 ? fmtPct(milk / (water + milk)) : '0%';
    }
  }
  if (el.matches('[data-form]')) {
    const field = el.dataset.form;
    let val = el.type === 'checkbox' ? el.checked : el.value;
    if (el.type === 'range' || el.type === 'number') val = Number(val);
    form[field] = val;
    if (field === 'waterMl' || field === 'milkMl') {
      const tea = getTea(form.teaId);
      const water = Number(form.waterMl), milk = Number(form.milkMl);
      const conc = round1(((tea ? Number(tea.bagMassG) : 2) / water) * 1000);
      const mf = fmtPct(milk / (water + milk));
      if ($('#out-water')) $('#out-water').textContent = Math.round(water);
      if ($('#out-milk')) $('#out-milk').textContent = Math.round(milk);
      if ($('#out-conc')) $('#out-conc').textContent = conc;
      if ($('#out-total')) $('#out-total').textContent = Math.round(water + milk);
      if ($('#out-milkfrac')) $('#out-milkfrac').textContent = mf;
    }
    if (field === 'tempC' && $('#out-temp')) $('#out-temp').textContent = Math.round(form.tempC);
    state.settings.lastRecipe = clone(form);
    saveState();
  }
});

/* ---------- boot ---------- */
function renderSheetOnly() {
  const root = $('#sheet-root');
  if (!ui.sheet) { root.innerHTML = ''; return; }
  if (ui.sheet.type === 'rating') root.innerHTML = ratingSheetHtml();
  else if (ui.sheet.type === 'detail') root.innerHTML = detailSheetHtml();
  else if (ui.sheet.type === 'settings') root.innerHTML = settingsSheetHtml();
  else if (ui.sheet.type === 'tea') root.innerHTML = teaSheetHtml();
  else if (ui.sheet.type === 'library') root.innerHTML = librarySheetHtml();
  else if (ui.sheet.type === 'confirm') root.innerHTML = confirmSheetHtml();
  else if (ui.sheet.type === 'actuals') root.innerHTML = actualsSheetHtml();
  else if (ui.sheet.type === 'manual') root.innerHTML = manualSheetHtml();
}

function render() {
  $('#view').innerHTML = ui.tab === 'brew' ? renderBrew() : ui.tab === 'history' ? renderHistory() : renderInsights();
  $$('.tabbar button').forEach(b => b.classList.toggle('active', b.dataset.tab === ui.tab));
  const badge = $('#badge');
  const n = state.brews.filter(b => b.confirmed === false || !b.ratings || !b.ratings.length).length;
  badge.textContent = n || '';
  badge.style.display = n ? 'grid' : 'none';
  renderSheetOnly();
  const toastEl = $('#toast');
  if (toastEl) {
    toastEl.style.top = ui.sheet ? '14px' : '';
    toastEl.style.bottom = ui.sheet ? 'auto' : '';
  }
  if (ui.tab === 'brew' && activeBrews.length) ensureTick();
}

window.__appErrors = [];
window.addEventListener('error', e => window.__appErrors.push(String(e.message || e)));
window.addEventListener('unhandledrejection', e => window.__appErrors.push(String(e.reason || e)));

window.handleAndroidBack = function() {
  if (ui.sheet) {
    ui.sheet = null;
    render();
    return true;
  }
  if (ui.tab === 'brew' && ui.brewView !== 'new') {
    ui.brewView = 'new';
    render();
    return true;
  }
  if (ui.tab !== 'brew') {
    ui.tab = 'brew';
    render();
    return true;
  }
  return false;
};

render();

const isAndroidShell = new URLSearchParams(location.search).get('android') === '1';
if (!isAndroidShell && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
</body>
</html>
